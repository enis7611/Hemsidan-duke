<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="Duke Systems AB – Vi löser problemet. Sedan 1988.">
<meta property="og:description" content="Nordisk distributör av ExtendSim. Simulering, AI-integration via MCP och IT-infrastruktur.">
<meta property="og:type" content="website">
<title>{{TITLE}}</title>{{ROBOTS}}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">

<style>
/* ─── RESET & ROOT ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:      #1B4F4F;
  --navy-mid:  #236060;
  --steel:     #00897B;
  --steel-lt:  #4DB6AC;
  --teal:      #00BFA5;
  --amber:     #D9937A;
  --amber-dk:  #C07B62;
  --bg:        #FAFFFE;
  --white:     #FFFFFF;
  --text:      #1B4F4F;
  --text-muted:#4A6960;
  --border:    #D0EDE9;
  --card-shadow: 0 2px 20px rgba(13,43,43,0.09);
  --card-hover:  0 8px 40px rgba(13,43,43,0.16);

  --serif: 'IBM Plex Serif', Georgia, serif;
  --sans:  'IBM Plex Sans', system-ui, sans-serif;
  --mono:  'IBM Plex Mono', 'Courier New', monospace;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
}

/* ─── ANIMATIONS ───────────────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes slideRight {
  from { opacity: 0; transform: translateX(-24px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.5; }
}
@keyframes gridShift {
  from { background-position: 0 0; }
  to   { background-position: 40px 40px; }
}

.anim-fade-up   { animation: fadeUp 0.7s ease both; }
.anim-fade-in   { animation: fadeIn 0.7s ease both; }
.anim-slide-right { animation: slideRight 0.7s ease both; }

.delay-1 { animation-delay: 0.1s; }
.delay-2 { animation-delay: 0.2s; }
.delay-3 { animation-delay: 0.3s; }
.delay-4 { animation-delay: 0.4s; }
.delay-5 { animation-delay: 0.5s; }
.delay-6 { animation-delay: 0.6s; }
.delay-7 { animation-delay: 0.7s; }

/* ─── TYPOGRAPHY ───────────────────────────────────────────── */
h1, h2, h3, h4 { font-family: var(--serif); line-height: 1.2; }
h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 700; }
h2 { font-size: clamp(1.6rem, 3vw, 2.4rem); font-weight: 600; }
h3 { font-size: 1.2rem; font-weight: 600; font-family: var(--sans); }
p  { color: var(--text-muted); line-height: 1.75; }

.section-label {
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--steel);
  display: block;
  margin-bottom: 0.75rem;
}

/* ─── LAYOUT ───────────────────────────────────────────────── */
.container {
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 2rem;
}

section { padding: 96px 0; }

/* ─── BUTTONS ──────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 13px 28px;
  border-radius: 4px;
  font-family: var(--sans);
  font-size: 0.9rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.22s ease;
  border: 2px solid transparent;
}
.btn-primary {
  background: var(--amber);
  color: #FFFFFF;
  border-color: var(--amber);
}
.btn-primary:hover {
  background: var(--amber-dk);
  border-color: var(--amber-dk);
  color: #FFFFFF;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(217,147,122,0.4);
}
.btn-ghost {
  background: transparent;
  color: var(--white);
  border-color: rgba(255,255,255,0.45);
}
.btn-ghost:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.8);
  transform: translateY(-2px);
}
.btn-outline {
  background: transparent;
  color: var(--steel);
  border-color: var(--steel);
}
.btn-outline:hover {
  background: var(--steel);
  color: var(--white);
  transform: translateY(-2px);
}
.btn-teal {
  background: var(--teal);
  color: var(--navy);
  border-color: var(--teal);
}
.btn-teal:hover {
  background: #00a891;
  border-color: #00a891;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,191,165,0.35);
}

/* ─── HEADER / NAV ─────────────────────────────────────────── */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 72px;
  background: linear-gradient(90deg, #1B4F4F 0%, #236060 100%);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  transition: box-shadow 0.3s;
}
header.scrolled {
  box-shadow: 0 4px 32px rgba(0,0,0,0.35);
}

.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
}

.nav-logo {
  display: flex;
  flex-direction: column;
  text-decoration: none;
  line-height: 1.1;
}
.nav-logo-main {
  font-family: 'Permanent Marker', cursive;
  font-size: 1.35rem;
  font-weight: 400;
  color: var(--white);
  letter-spacing: 0.02em;
}
.nav-logo-main .logo-asterisks {
  color: var(--amber);
  font-size: 1.1rem;
  letter-spacing: 0;
}
.nav-logo-sub {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--steel-lt);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 2rem;
  list-style: none;
}
.nav-links a {
  font-size: 0.875rem;
  font-weight: 400;
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  letter-spacing: 0.02em;
  transition: color 0.2s;
  position: relative;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -3px; left: 0;
  width: 0; height: 2px;
  background: var(--amber);
  transition: width 0.2s;
}
.nav-links a:hover { color: var(--white); }
.nav-links a:hover::after { width: 100%; }

.nav-links .mcp-badge {
  font-size: 0.65rem;
  font-family: var(--mono);
  background: var(--teal);
  color: var(--navy);
  padding: 2px 6px;
  border-radius: 3px;
  font-weight: 500;
  vertical-align: middle;
  margin-left: 4px;
}

.nav-cta { margin-left: 0.5rem; }

.lang-toggle {
  display: flex;
  align-items: center;
  gap: 3px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 20px;
  padding: 5px 12px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  transition: all 0.2s;
  margin-left: 0.75rem;
}
.lang-toggle:hover {
  background: rgba(255,255,255,0.14);
  border-color: rgba(255,255,255,0.3);
}
.lang-sv, .lang-en {
  color: rgba(255,255,255,0.45);
  transition: color 0.2s;
}
.lang-divider {
  color: rgba(255,255,255,0.25);
}
.lang-toggle.sv .lang-sv { color: #FFFFFF; }
.lang-toggle.en .lang-en { color: #FFFFFF; }
.lang-toggle.sv .lang-en { color: rgba(255,255,255,0.35); }
.lang-toggle.en .lang-sv { color: rgba(255,255,255,0.35); }

.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 4px;
  background: none;
  border: none;
}
.hamburger span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--white);
  transition: all 0.3s;
}

/* ─── MOBILE NAV ───────────────────────────────────────────── */
.mobile-nav {
  display: none;
  position: fixed;
  top: 72px; left: 0; right: 0; bottom: 0;
  background: var(--navy);
  z-index: 99;
  padding: 2rem;
  flex-direction: column;
  gap: 1.5rem;
  overflow-y: auto;
}
.mobile-nav.open { display: flex; }
.mobile-nav a {
  font-size: 1.2rem;
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  font-weight: 400;
  padding-bottom: 1rem;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.mobile-nav a:hover { color: var(--amber); }

/* ─── HERO ─────────────────────────────────────────────────── */
#hero {
  min-height: 100vh;
  background: linear-gradient(135deg, #1B4F4F 0%, #236060 45%, #2d7a7a 100%);
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
  padding-top: 72px;
}

.hero-grid-bg {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,137,123,0.15) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,137,123,0.15) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridShift 20s linear infinite;
}

.hero-glow {
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,137,123,0.2) 0%, transparent 70%);
  top: -100px;
  right: -100px;
  pointer-events: none;
}
.hero-glow-2 {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(217,147,122,0.12) 0%, transparent 70%);
  bottom: 50px;
  left: -50px;
  pointer-events: none;
}

.hero-inner {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: center;
  padding: 80px 0;
}

.hero-content {}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--steel-lt);
  margin-bottom: 1.5rem;
}
.hero-eyebrow::before {
  content: '';
  display: block;
  width: 28px;
  height: 1px;
  background: var(--steel-lt);
}

.hero-title {
  color: var(--white);
  margin-bottom: 1.5rem;
  line-height: 1.1;
}
.hero-title em {
  font-style: normal;
  color: var(--amber);
}

.hero-sub {
  font-size: 1.05rem;
  color: rgba(255,255,255,0.62);
  max-width: 480px;
  margin-bottom: 2.5rem;
  line-height: 1.75;
}

.hero-actions {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}

/* Hero visual */
.hero-visual {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sim-diagram {
  width: 100%;
  max-width: 460px;
  aspect-ratio: 4/3;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(0,137,123,0.3);
  border-radius: 12px;
  padding: 2rem;
  position: relative;
  overflow: hidden;
}
.sim-diagram::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(0,137,123,0.06) 0%, transparent 60%);
}

/* Animated nodes */
.nodes-svg {
  width: 100%;
  height: 100%;
}

.node-pulse {
  animation: pulse 2.5s ease-in-out infinite;
}
.node-pulse-2 { animation-delay: 0.8s; }
.node-pulse-3 { animation-delay: 1.6s; }

@keyframes flowDash {
  to { stroke-dashoffset: -20; }
}
.flow-line {
  stroke-dasharray: 5 5;
  animation: flowDash 1.2s linear infinite;
}

.sim-label {
  position: absolute;
  bottom: 1rem;
  left: 1rem;
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--steel-lt);
  letter-spacing: 0.1em;
}

/* ─── SERVICES OVERVIEW ─────────────────────────────────────── */
#tjanster {
  background: var(--white);
  padding: 96px 0;
}

.section-header {
  text-align: center;
  margin-bottom: 4rem;
}
.section-header h2 {
  color: var(--navy);
  margin-bottom: 1rem;
}
.section-header p {
  max-width: 540px;
  margin: 0 auto;
}

.services-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
}

.service-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 2.25rem;
  transition: all 0.28s ease;
  position: relative;
  overflow: hidden;
  text-decoration: none;
  display: block;
  color: inherit;
}
.service-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--steel);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.28s ease;
}
.service-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--card-hover);
  border-color: transparent;
}
.service-card:hover::before {
  transform: scaleX(1);
}
.service-card.mcp::before { background: var(--teal); }
.service-card.konsult::before { background: var(--amber); }

.card-icon {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.5rem;
  font-size: 1.4rem;
}
.card-icon.blue  { background: rgba(0,137,123,0.1); }
.card-icon.teal  { background: rgba(0,191,165,0.1); }
.card-icon.amber { background: rgba(217,147,122,0.12); }

.service-card h3 {
  color: var(--navy);
  font-size: 1.15rem;
  margin-bottom: 0.75rem;
}
.service-card p {
  font-size: 0.9rem;
  line-height: 1.7;
  margin-bottom: 1.25rem;
}
.card-link {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--steel);
  display: flex;
  align-items: center;
  gap: 0.4rem;
  text-decoration: none;
  transition: gap 0.2s;
}
.service-card:hover .card-link { gap: 0.7rem; }
.card-link.teal-link { color: var(--teal); }
.card-link.amber-link { color: var(--amber-dk); }

.new-tag {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: var(--teal);
  color: var(--navy);
  padding: 2px 7px;
  border-radius: 3px;
  margin-left: 8px;
  vertical-align: middle;
}

/* ─── WHY DUKE ──────────────────────────────────────────────── */
#varfor {
  background: linear-gradient(160deg, #1B4F4F 0%, #1E5A5A 50%, #236060 100%);
  position: relative;
  overflow: hidden;
}
#varfor::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,137,123,0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,137,123,0.1) 1px, transparent 1px);
  background-size: 40px 40px;
}

.varfor-inner {
  position: relative;
  z-index: 2;
}

.varfor-header {
  text-align: center;
  margin-bottom: 4rem;
}
.varfor-header h2 { color: var(--white); margin-bottom: 1rem; }
.varfor-header p { color: rgba(255,255,255,0.7); }

.pillars {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.5rem;
}

.pillar {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  padding: 2rem 1.5rem;
  text-align: center;
  transition: all 0.28s ease;
}
.pillar:hover {
  background: rgba(255,255,255,0.14);
  transform: translateY(-4px);
}

.pillar-num {
  font-family: var(--serif);
  font-size: 2.8rem;
  font-weight: 700;
  color: var(--amber);
  line-height: 1;
  margin-bottom: 0.5rem;
}
.pillar h3 {
  color: var(--white);
  font-size: 0.95rem;
  font-family: var(--sans);
  font-weight: 500;
  margin-bottom: 0.5rem;
}
.pillar p {
  font-size: 0.83rem;
  color: rgba(255,255,255,0.65);
  line-height: 1.6;
}

/* ─── EXTENDSIM ─────────────────────────────────────────────── */
#extendsim {
  background: var(--bg);
}

.extendsim-intro {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: center;
  margin-bottom: 4rem;
}

.extendsim-text h2 { color: var(--navy); margin-bottom: 1rem; }
.extendsim-text p { margin-bottom: 1.5rem; }

.andritz-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 10px;
  margin-bottom: 1.5rem;
}

.products-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.25rem;
}

.product-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.75rem;
  transition: all 0.25s ease;
}
.product-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--card-shadow);
  border-color: rgba(0,137,123,0.25);
}

.product-tier {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--steel);
  margin-bottom: 0.5rem;
}
.product-card h3 {
  color: var(--navy);
  font-family: var(--serif);
  font-size: 1.3rem;
  margin-bottom: 0.75rem;
}
.product-card p {
  font-size: 0.88rem;
  margin-bottom: 1.25rem;
}

.product-features {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  margin-bottom: 1.5rem;
}
.product-features li {
  font-size: 0.82rem;
  color: var(--text-muted);
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
}
.product-features li::before {
  content: '→';
  color: var(--steel);
  flex-shrink: 0;
  font-size: 0.75rem;
  margin-top: 2px;
}

/* ─── MCP SECTION ───────────────────────────────────────────── */
#mcp {
  background: linear-gradient(135deg, #1E5A5A 0%, #1B4F4F 40%, #236060 100%);
  position: relative;
  overflow: hidden;
}

.mcp-bg-pattern {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 80% 50%, rgba(0,191,165,0.1) 0%, transparent 50%),
    radial-gradient(circle at 20% 80%, rgba(0,137,123,0.12) 0%, transparent 40%);
}

.mcp-inner {
  position: relative;
  z-index: 2;
}

.mcp-header {
  text-align: center;
  margin-bottom: 4rem;
}
.mcp-header .section-label { color: var(--teal); }
.mcp-header h2 {
  color: var(--white);
  margin-bottom: 1rem;
}
.mcp-header h2 span { color: var(--teal); }
.mcp-header p { color: rgba(255,255,255,0.75); max-width: 560px; margin: 0 auto; }

/* Flow diagram */
.mcp-flow {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin-bottom: 4rem;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.flow-node {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  padding: 1.5rem 2rem;
  text-align: center;
  min-width: 170px;
  transition: all 0.25s;
}
.flow-node:hover {
  background: rgba(255,255,255,0.16);
  transform: translateY(-3px);
}
.flow-node.ai-node  { border-color: rgba(0,191,165,0.55); }
.flow-node.mcp-node { border-color: rgba(0,137,123,0.6); background: rgba(255,255,255,0.13); }
.flow-node.ext-node { border-color: rgba(255,179,0,0.45); }

.flow-node-icon {
  font-size: 1.75rem;
  margin-bottom: 0.5rem;
}
.flow-node h4 {
  font-family: var(--sans);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--white);
  margin-bottom: 0.25rem;
}
.flow-node p {
  font-size: 0.72rem;
  color: rgba(255,255,255,0.4);
  line-height: 1.4;
}

.flow-arrow {
  color: rgba(255,255,255,0.2);
  font-size: 1.5rem;
  flex-shrink: 0;
  margin: 0 0.25rem;
}

/* Code terminal */
.mcp-terminal {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(0,191,165,0.2);
  border-radius: 10px;
  overflow: hidden;
  max-width: 680px;
  margin: 0 auto 3rem;
}
.terminal-bar {
  background: rgba(0,0,0,0.3);
  padding: 0.65rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.terminal-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
}
.terminal-dot:nth-child(1) { background: #ff5f56; }
.terminal-dot:nth-child(2) { background: #ffbd2e; }
.terminal-dot:nth-child(3) { background: #27c93f; }
.terminal-title {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: rgba(255,255,255,0.35);
  margin-left: 0.5rem;
  letter-spacing: 0.05em;
}
.terminal-body {
  padding: 1.5rem;
}
.terminal-line {
  font-family: var(--mono);
  font-size: 0.85rem;
  line-height: 2;
  display: flex;
  gap: 0.75rem;
}
.terminal-prompt { color: var(--teal); flex-shrink: 0; }
.terminal-cmd    { color: rgba(255,255,255,0.85); }
.terminal-comment { color: rgba(255,255,255,0.3); }
.terminal-result  { color: var(--steel-lt); }

/* MCP compatibility */
.mcp-compat {
  text-align: center;
}
.mcp-compat p {
  color: rgba(255,255,255,0.4);
  font-size: 0.85rem;
  margin-bottom: 1.25rem;
  font-family: var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.compat-badges {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  flex-wrap: wrap;
}
.compat-badge {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  padding: 8px 18px;
  font-family: var(--sans);
  font-size: 0.85rem;
  color: rgba(255,255,255,0.7);
  font-weight: 400;
}

/* ─── KONSULT ───────────────────────────────────────────────── */
#konsult {
  background: var(--white);
}

.konsult-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
}

.konsult-track {
  background: var(--bg);
  border-radius: 12px;
  padding: 2.5rem;
  border: 1px solid var(--border);
}
.konsult-track h3 {
  font-family: var(--serif);
  font-size: 1.3rem;
  color: var(--navy);
  margin-bottom: 0.5rem;
}
.konsult-track .track-sub {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 2rem;
}

.track-items {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
.track-item {
  display: flex;
  gap: 1rem;
  align-items: flex-start;
}
.track-item-icon {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
  background: rgba(0,137,123,0.1);
}
.track-item-icon.amber-bg { background: rgba(217,147,122,0.12); }

.track-item h4 {
  font-family: var(--sans);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 0.2rem;
}
.track-item p {
  font-size: 0.83rem;
  line-height: 1.55;
}

/* Infra logos */
.infra-logos {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-top: 1.75rem;
}
.infra-chip {
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 10px;
  color: var(--text-muted);
  background: var(--white);
}

/* ─── BRANSCHER ─────────────────────────────────────────────── */
#branscher {
  background: var(--bg);
  padding: 72px 0;
}

.branscher-inner {
  text-align: center;
}
.branscher-inner h2 { color: var(--navy); margin-bottom: 0.75rem; }
.branscher-inner > p { margin-bottom: 3rem; }

.bransch-strip {
  display: flex;
  justify-content: center;
  gap: 1rem;
  flex-wrap: wrap;
}
.bransch-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.75rem 2rem;
  min-width: 150px;
  transition: all 0.25s;
}
.bransch-item:hover {
  border-color: var(--steel);
  transform: translateY(-3px);
  box-shadow: var(--card-shadow);
}
.bransch-item .b-icon { font-size: 2rem; }
.bransch-item span {
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--navy);
}

/* ─── CTA BANNER ────────────────────────────────────────────── */
#cta-banner {
  background: linear-gradient(135deg, #1B4F4F 0%, #236060 50%, #287070 100%);
  padding: 80px 0;
  position: relative;
  overflow: hidden;
}
#cta-banner::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(217,147,122,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(217,147,122,0.06) 1px, transparent 1px);
  background-size: 60px 60px;
}

.cta-inner {
  position: relative;
  z-index: 2;
  text-align: center;
}
.cta-inner h2 {
  color: var(--white);
  margin-bottom: 1rem;
  font-size: clamp(1.6rem, 3.5vw, 2.6rem);
}
.cta-inner p {
  color: rgba(255,255,255,0.75);
  max-width: 480px;
  margin: 0 auto 2.5rem;
  font-size: 1rem;
}
.cta-actions {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
}

/* ─── OM OSS ─────────────────────────────────────────────────── */
#om-oss {
  background: var(--white);
}

.om-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5rem;
  align-items: center;
}
.om-text h2 { color: var(--navy); margin-bottom: 1.5rem; }
.om-text p  { margin-bottom: 1rem; }

.om-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
}
.stat-box {
  background: var(--bg);
  border-radius: 10px;
  padding: 1.75rem;
  border: 1px solid var(--border);
}
.stat-box .stat-num {
  font-family: var(--serif);
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--navy);
  line-height: 1;
  margin-bottom: 0.4rem;
}
.stat-box .stat-label {
  font-size: 0.82rem;
  color: var(--text-muted);
  line-height: 1.4;
}

/* ─── KONTAKT ───────────────────────────────────────────────── */
#kontakt {
  background: var(--bg);
}

.kontakt-grid {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 4rem;
  align-items: start;
}

.kontakt-info h2 { color: var(--navy); margin-bottom: 1rem; }
.kontakt-info p  { margin-bottom: 2rem; }

.kontakt-details {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.kontakt-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.9rem;
  color: var(--text-muted);
}
.kontakt-item strong {
  color: var(--navy);
  font-weight: 500;
  min-width: 55px;
}
.kontakt-item a {
  color: var(--steel);
  text-decoration: none;
}
.kontakt-item a:hover { text-decoration: underline; }

.contact-form {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2.5rem;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  margin-bottom: 1.25rem;
}
.form-group label {
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--navy);
  letter-spacing: 0.02em;
}
.form-group input,
.form-group select,
.form-group textarea {
  font-family: var(--sans);
  font-size: 0.9rem;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
  width: 100%;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: var(--steel);
  box-shadow: 0 0 0 3px rgba(0,137,123,0.12);
  background: var(--white);
}
.form-group textarea { min-height: 120px; resize: vertical; }
.form-group select { cursor: pointer; }

.gdpr-check {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  margin-bottom: 1.5rem;
}
.gdpr-check input[type="checkbox"] {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  margin-top: 2px;
  accent-color: var(--steel);
  cursor: pointer;
}
.gdpr-check label {
  font-size: 0.78rem;
  color: var(--text-muted);
  line-height: 1.5;
}
.gdpr-check a { color: var(--steel); text-decoration: underline; }

/* ─── FOOTER ────────────────────────────────────────────────── */
footer {
  background: linear-gradient(180deg, #236060 0%, #1B4F4F 100%);
  padding: 56px 0 32px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.footer-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 2.5rem;
  margin-bottom: 3rem;
}

.footer-brand {}
.footer-logo-main {
  font-family: 'Permanent Marker', cursive;
  font-size: 1.25rem;
  font-weight: 400;
  color: var(--white);
  margin-bottom: 0.25rem;
  letter-spacing: 0.02em;
}
.footer-logo-main .logo-asterisks {
  color: var(--amber);
  font-size: 1rem;
}
.footer-logo-sub {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--steel-lt);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 1rem;
}
.footer-brand p {
  font-size: 0.83rem;
  color: rgba(255,255,255,0.6);
  line-height: 1.65;
}

.footer-col h4 {
  font-family: var(--sans);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  margin-bottom: 1.1rem;
}
.footer-col ul { list-style: none; }
.footer-col ul li {
  margin-bottom: 0.55rem;
}
.footer-col ul li a {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.8);
  text-decoration: none;
  transition: color 0.2s;
}
.footer-col ul li a:hover { color: var(--white); }
.footer-col ul li a .new-tag { font-size: 0.58rem; padding: 1px 5px; }

.footer-bottom {
  border-top: 1px solid rgba(255,255,255,0.07);
  padding-top: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
}
.footer-bottom p {
  font-size: 0.78rem;
  color: rgba(255,255,255,0.28);
}
.footer-bottom a {
  color: rgba(255,255,255,0.35);
  text-decoration: none;
  font-size: 0.78rem;
}
.footer-bottom a:hover { color: rgba(255,255,255,0.65); }

/* ─── INTERSECTION OBSERVER CLASSES ────────────────────────── */
.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.65s ease, transform 0.65s ease;
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-delay-1 { transition-delay: 0.1s; }
.reveal-delay-2 { transition-delay: 0.2s; }
.reveal-delay-3 { transition-delay: 0.3s; }
.reveal-delay-4 { transition-delay: 0.4s; }

/* ─── RESPONSIVE ───────────────────────────────────────────── */
@media (max-width: 1024px) {
  .services-grid { grid-template-columns: 1fr 1fr; }
  .footer-grid   { grid-template-columns: 1fr 1fr; }
  .pillars       { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 768px) {
  section { padding: 64px 0; }

  .nav-links, .nav-cta { display: none; }
  .hamburger { display: flex; }

  .hero-inner     { grid-template-columns: 1fr; gap: 2.5rem; }
  .hero-visual    { display: none; }
  .hero-sub       { font-size: 0.95rem; }

  .services-grid  { grid-template-columns: 1fr; }
  .products-grid  { grid-template-columns: 1fr; }
  .konsult-grid   { grid-template-columns: 1fr; }
  .om-grid        { grid-template-columns: 1fr; gap: 2.5rem; }
  .kontakt-grid   { grid-template-columns: 1fr; }
  .footer-grid    { grid-template-columns: 1fr 1fr; }
  .pillars        { grid-template-columns: 1fr 1fr; }
  .extendsim-intro { grid-template-columns: 1fr; gap: 2rem; }
  .mcp-flow       { flex-direction: column; align-items: stretch; max-width: 300px; margin-left: auto; margin-right: auto; }
  .flow-arrow     { transform: rotate(90deg); text-align: center; }
  .form-row       { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
  .footer-grid    { grid-template-columns: 1fr; }
  .pillars        { grid-template-columns: 1fr; }
  .footer-bottom  { flex-direction: column; gap: 0.5rem; }
}
</style>
